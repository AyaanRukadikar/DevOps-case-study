# OPTION A (easiest): configure the machine you are sitting on (Ubuntu / Debian / WSL Ubuntu).
[app_servers]
localhost ansible_connection=local

# OPTION B: configure a remote Ubuntu VM over SSH. Comment out the two lines above,
# uncomment the next two, and put your VM's IP address and login user.
# [app_servers]
# vm1 ansible_host=192.168.56.10 ansible_user=ubuntu
